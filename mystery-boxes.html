<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>3D Express Mystery Boxes</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#fff;color:#111;text-align:center}
main{max-width:800px;margin:0 auto;padding:50px 20px}
h1{font-size:42px}
.boxes{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;margin:35px 0}
.box{border:3px solid #111;border-radius:16px;padding:25px;width:130px}
.price{font-size:28px;font-weight:900}
a{display:inline-block;padding:12px 20px;background:#111;color:#fff;text-decoration:none;border-radius:10px}
.note{font-weight:bold;margin-top:30px}
</style>
</head>
<body>
<main>
<h1>🎁 Mystery Boxes 🎁</h1>
<p>Pick a mystery box price and see what surprise awaits!</p>
<div class="boxes">
<div class="box"><div class="price">$20</div></div>
<div class="box"><div class="price">$30</div></div>
<div class="box"><div class="price">$40</div></div>
<div class="box"><div class="price">$50</div></div>
</div>
<p class="note">No refunds • No returns</p>
<a href="index.html">← Back to 3D Express</a>
</main>

</html>
